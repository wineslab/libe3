#
# libe3py: the Python binding of libe3, built against the libe3 installed on the
# machine (see python/CMakeLists.txt). Install libe3 first, then `pip install libe3py`.
[build-system]
requires = ["scikit-build-core>=0.8", "swig>=4.0"]
build-backend = "scikit_build_core.build"

[project]
name = "libe3py"
dynamic = ["version"]
description = "Python binding of libe3, the O-RAN E3 interface library"
readme = "python/README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Northeastern University" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/wineslab/libe3"
Documentation = "https://github.com/wineslab/libe3/blob/main/swig/README.md"

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
cmake.source-dir = "python"
build-dir = "build/{wheel_tag}"
wheel.packages = []
sdist.exclude = ["*"]
sdist.include = [
    "VERSION", "LICENSE", "NOTICE", "pyproject.toml",
    "python/**", "swig/**", "cmake/libe3SwigModule.cmake",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>\\d+\\.\\d+\\.\\d+)"

# Prebuilt wheels (manylinux_2_28), built by .github/workflows/build-wheels.yml. Unlike the
# sdist, a wheel is built from the full checkout and contains libe3 itself (all encodings,
# and libzmq, protobuf linked statically), so `pip install libe3py`
# needs no libe3, compiler or SWIG on the machine.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "bash {project}/scripts/wheel_deps.sh"
environment = { CMAKE_PREFIX_PATH = "/opt/protobuf", PATH = "/opt/protobuf/bin:$PATH", PKG_CONFIG_PATH = "/opt/zeromq/lib64/pkgconfig:/opt/zeromq/lib/pkgconfig" }

[tool.cibuildwheel.config-settings]
"cmake.source-dir" = "."
"cmake.define.LIBE3_ENABLE_SWIG" = "ON"
"cmake.define.LIBE3_ENABLE_ASN1" = "ON"
"cmake.define.LIBE3_ENABLE_JSON" = "ON"
"cmake.define.LIBE3_ENABLE_PROTOBUF" = "ON"
"cmake.define.LIBE3_BUILD_TESTS" = "OFF"
"cmake.define.LIBE3_BUILD_EXAMPLES" = "OFF"
"install.components" = "libe3py"
