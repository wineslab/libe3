version = 1

# Files that carry no in-file SPDX header on purpose: prose, plain-data files,
# and the license/notice texts themselves. Everything else in the tree has the
# two-line header inline (enforced by `reuse lint` in the Commit policy
# workflow), so this list should stay short.
[[annotations]]
path = [
    "**/*.md",
    "CITATION.cff",
    "CONTRIBUTORS",
    "LICENSE",
    "NOTICE",
    "VERSION",
    ".gitignore",
    ".github/CODEOWNERS",
]
SPDX-FileCopyrightText = "Copyright (c) 2026 Northeastern University"
SPDX-License-Identifier = "Apache-2.0"

# Vendored from NVIDIA/aerial-sample-apps, unchanged. The notice is inside a
# JSON string where reuse cannot read it, so it is restated here.
[[annotations]]
path = "tests/fixtures/aerial/e3_message_examples.json"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"
