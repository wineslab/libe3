name: Commit policy

# Enforce the contribution policy documented in CONTRIBUTING.md:
#   - AI agents must not add Co-authored-by/Signed-off-by; AI assistance is disclosed
#     via an `Assisted-by:` trailer whose value is free-form (any non-empty descriptor);
#   - the PR branch is a linear, fast-forward-able descendant of `main` (no merge commits);
#   - every commit in the PR builds and passes tests on its own (atomic commits).
#
# The fast-forward merge command is no longer posted here: it is a section of the
# consolidated CI report (.github/workflows/ci-report.yml), which already waits
# for every required check instead of polling for them from inside this workflow.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: commit-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-trailers:
    name: AI-assistant trailer policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check commit trailers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          python3 scripts/check_commit_trailers.py --base "$base" --head "$head"

  linear-history:
    name: Fast-forward / linear history
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check linear, fast-forward-able history
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          merges="$(git rev-list --merges "$base..$head")"
          if [ -n "$merges" ]; then
            echo "::error::PR contains merge commits; rebase onto main (fast-forward only, no merge commits)."
            git log --merges --oneline "$base..$head"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$base" "$head"; then
            echo "::error::Branch is behind main; rebase onto the latest main so it can be fast-forwarded."
            exit 1
          fi
          echo "Linear history OK: $(git rev-list --count "$base..$head") commit(s), fast-forward-able."

  changes:
    name: Detect code changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          echo "Changed files:"; git diff --name-only "$base..$head"
          noncode='(\.md$)|(^docs/)|(^\.github/)|(^LICENSE$)|(^CONTRIBUTORS$)|(^\.gitignore$)'
          if git diff --name-only "$base..$head" | grep -qvE "$noncode"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  per-commit-build:
    name: Each commit builds and tests
    needs: changes
    # Job-level `if:` stays for the event-type check (this job is only
    # meaningful for a pull_request event) but the code-change check moved to
    # the steps below: a job-level `if: ... && code == 'true'` reports
    # "skipped" (not "success") on a docs-only PR, and required-status-checks
    # does not treat "skipped" as satisfied -- confirmed against this repo's
    # own history (PR #43 merged with this exact context skipped, relying on
    # admin bypass). Running unconditionally and skipping only the expensive
    # steps keeps the same savings while still reporting success.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare /opt/asn1c for caching
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo mkdir -p /opt/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/asn1c

      - name: Cache asn1c build
        # Exact-match only: a hit must imply the pinned commit inside
        # build_libe3 is unchanged. Do not add restore-keys here.
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: /opt/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install build dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          chmod +x ./build_libe3
          ./build_libe3 -I

      - name: Build and test every commit (Release)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          set -e
          for sha in $(git rev-list --reverse "$base..$head"); do
            echo "::group::Building commit $sha"
            git -c advice.detachedHead=false checkout --quiet --detach "$sha"
            chmod +x ./build_libe3 || true
            ./build_libe3 -c -d build -j "$(nproc)" -r -t
            echo "::endgroup::"
          done
