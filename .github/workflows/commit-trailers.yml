name: Commit policy

# Enforce the contribution policy documented in CONTRIBUTING.md:
#   - AI agents must not add Co-authored-by/Signed-off-by; AI assistance is disclosed
#     via an `Assisted-by:` trailer whose value is free-form (any non-empty descriptor);
#   - the PR branch is a linear, fast-forward-able descendant of `main` (no merge commits);
#   - every commit in the PR builds and passes tests on its own (atomic commits).
# On approval, it also posts the exact fast-forward merge command for the maintainer.

on:
  pull_request:
  pull_request_review:
    types: [submitted]
  push:
    branches:
      - main

concurrency:
  group: commit-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-trailers:
    name: AI-assistant trailer policy
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check commit trailers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          python3 scripts/check_commit_trailers.py --base "$base" --head "$head"

  linear-history:
    name: Fast-forward / linear history
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check linear, fast-forward-able history
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          merges="$(git rev-list --merges "$base..$head")"
          if [ -n "$merges" ]; then
            echo "::error::PR contains merge commits; rebase onto main (fast-forward only, no merge commits)."
            git log --merges --oneline "$base..$head"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$base" "$head"; then
            echo "::error::Branch is behind main; rebase onto the latest main so it can be fast-forwarded."
            exit 1
          fi
          echo "Linear history OK: $(git rev-list --count "$base..$head") commit(s), fast-forward-able."

  changes:
    name: Detect code changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          echo "Changed files:"; git diff --name-only "$base..$head"
          noncode='(\.md$)|(^docs/)|(^\.github/)|(^LICENSE$)|(^CONTRIBUTORS$)|(^\.gitignore$)'
          if git diff --name-only "$base..$head" | grep -qvE "$noncode"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  per-commit-build:
    name: Each commit builds and tests
    needs: changes
    # Job-level `if:` stays for the event-type check (this job is only
    # meaningful for a pull_request event) but the code-change check moved to
    # the steps below: a job-level `if: ... && code == 'true'` reports
    # "skipped" (not "success") on a docs-only PR, and required-status-checks
    # does not treat "skipped" as satisfied -- confirmed against this repo's
    # own history (PR #43 merged with this exact context skipped, relying on
    # admin bypass). Running unconditionally and skipping only the expensive
    # steps keeps the same savings while still reporting success.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare /opt/asn1c for caching
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo mkdir -p /opt/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/asn1c

      - name: Cache asn1c build
        # Exact-match only: a hit must imply the pinned commit inside
        # build_libe3 is unchanged. Do not add restore-keys here.
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: /opt/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install build dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          chmod +x ./build_libe3
          ./build_libe3 -I

      - name: Build and test every commit (Release)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          set -e
          for sha in $(git rev-list --reverse "$base..$head"); do
            echo "::group::Building commit $sha"
            git -c advice.detachedHead=false checkout --quiet --detach "$sha"
            chmod +x ./build_libe3 || true
            ./build_libe3 -c -d build -j "$(nproc)" -r -t
            echo "::endgroup::"
          done

  merge-command:
    name: Post fast-forward merge command
    # Used to trigger only on an approved pull_request_review, which never
    # fires for a solo-authored PR (GitHub doesn't let an author approve
    # their own PR, and there's no second reviewer) -- so this context sat
    # permanently "skipped" for solo work. It isn't itself a required check,
    # so that was harmless to mergeability, but it also meant the one job
    # meant to hand the maintainer the exact merge command never ran.
    #
    # Decoupled from review state entirely: what actually matters for
    # posting a trustworthy "ready to merge" comment is that the required
    # checks for this exact commit are green, not who clicked approve. Polls
    # the branch's *effective* required status checks (via the rules API,
    # so it can't drift from whatever the ruleset currently requires) until
    # they're all done, then posts only if every one succeeded.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Wait for required checks, then post the merge command
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e
          required="$(gh api "repos/$REPO/rules/branches/main" \
            --jq '.[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context')"
          echo "Required contexts for main:"; echo "$required"

          deadline=$(( $(date +%s) + 18*60 ))
          while true; do
            statuses="$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs" --paginate \
              --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion)"')"

            all_done=true
            all_success=true
            # Iterate over the required list, not over whatever check-runs
            # happen to exist yet: a required context that hasn't been
            # *created* yet (e.g. a matrix leg still queued behind another
            # job) never appears in $statuses at all, so a loop keyed off
            # $statuses would silently skip it and could see "everything
            # found is done" while a required check hasn't even started.
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              line="$(printf '%s\n' "$statuses" | awk -F'\t' -v n="$name" '$1==n{print; exit}')"
              if [ -z "$line" ]; then
                all_done=false
                continue
              fi
              status="$(printf '%s' "$line" | cut -f2)"
              conclusion="$(printf '%s' "$line" | cut -f3)"
              if [ "$status" != "completed" ]; then
                all_done=false
              elif [ "$conclusion" != "success" ]; then
                all_success=false
              fi
            done <<< "$required"

            if [ "$all_done" = "true" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out waiting for required checks to finish; not posting."
              exit 0
            fi
            sleep 20
          done

          if [ "$all_success" != "true" ]; then
            echo "Not every required check succeeded; not posting the merge command."
            exit 0
          fi

          marker='<!-- ready-to-merge -->'
          body=$(printf '%s\n' \
            "$marker" \
            '### Ready to merge (fast-forward only)' \
            '' \
            "All required checks are green for \`${HEAD_SHA:0:7}\`. A maintainer can land the reviewed commits with:" \
            '' \
            '```bash' \
            'git fetch origin' \
            "git checkout main && git merge --ff-only $HEAD_SHA && git push origin main" \
            '```' \
            '' \
            "Head: \`$HEAD_SHA\` (branch \`$BRANCH\`). If \`--ff-only\` fails as non-fast-forward, the branch must be rebased on the latest \`main\`.")

          existing="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" -X PATCH -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -X POST -f body="$body" > /dev/null
          fi
          echo "Posted/updated the ready-to-merge comment."
