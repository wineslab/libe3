name: MPMC Queue Benchmark

# Runs the lock-free MPMC ring-buffer benchmark and publishes the results for
# the consolidated CI report. Gated by `paths`: it only runs when the queue's
# core file changes (or the workflow itself), so unrelated PRs don't pay the
# benchmark cost.
# Use the "Run workflow" button (workflow_dispatch) to run it on demand.

on:
  pull_request:
    paths:
      - include/libe3/mpmc_queue.hpp
      - .github/workflows/mpmc-bench.yml
  workflow_dispatch:

concurrency:
  group: mpmc-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: MPMC Queue Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare /opt/asn1c for caching
        run: |
          sudo mkdir -p /opt/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/asn1c

      - name: Cache asn1c build
        # Exact-match only: a hit must imply the pinned commit inside
        # build_libe3 is unchanged. Do not add restore-keys here.
        uses: actions/cache@v5
        with:
          path: /opt/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install build dependencies
        run: |
          chmod +x ./build_libe3
          ./build_libe3 -I

      - name: Build (Release)
        run: |
          chmod +x ./build_libe3 || true
          ./build_libe3 -c -d build -j $(nproc) -r

      - name: Run MPMC benchmark
        run: ./build/test_bench_mpmc_queue | tee benchmark_results.md

      - name: Assemble report fragment
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          [ -f benchmark_results.md ] || exit 0
          {
            echo "### MPMC queue benchmark"
            echo ""
            cat benchmark_results.md
            echo ""
            echo "_ubuntu-latest, Release build._"
          } > ci-report-mpmc.md

      - name: Upload report fragment
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-report-mpmc-bench
          path: ci-report-mpmc.md
          if-no-files-found: warn
