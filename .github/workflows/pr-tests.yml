name: Unit Tests

on:
  pull_request:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          echo "Changed files:"; git diff --name-only "$base..$head"
          noncode='(\.md$)|(^docs/)|(^\.github/)|(^LICENSE$)|(^CONTRIBUTORS$)|(^\.gitignore$)'
          if git diff --name-only "$base..$head" | grep -qvE "$noncode"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Below: every job that does real work is gated at the STEP level on
  # needs.changes.outputs.code, not at the job level. A job-level `if:` makes
  # GitHub report the job's required-check context as "skipped" when false,
  # and required-status-checks does not treat "skipped" as satisfied -- on a
  # docs-only PR that would block merging (or require the SAME admin bypass
  # this whole "Detect code changes" gate was supposed to make unnecessary)
  # forever, confirmed empirically against this repo's own history (PR #43).
  # Running the job unconditionally and skipping only its expensive steps
  # keeps the CI-minutes savings while still reporting a real `success`.

  asn1c-cache:
    # Builds/warms the asn1c cache once, ahead of the matrix legs below, so
    # they don't race each other rebuilding it from source on a cold cache.
    name: Warm asn1c cache
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare /opt/asn1c for caching
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo mkdir -p /opt/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/asn1c

      - name: Cache asn1c build
        # Exact-match only: a hit must imply the pinned commit inside
        # build_libe3 is unchanged. Do not add restore-keys here.
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: /opt/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install build dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          chmod +x ./build_libe3
          ./build_libe3 -I

  test:
    name: Build and Test
    needs: [changes, asn1c-cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest]
        build_type: [Debug, Release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare /opt/asn1c for caching
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo mkdir -p /opt/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/asn1c

      - name: Cache asn1c build
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: /opt/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install build dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          chmod +x ./build_libe3
          ./build_libe3 -I

      - name: Build and test with build_libe3 (${{ matrix.build_type }})
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          chmod +x ./build_libe3 || true
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            BUILD_FLAG="-g"
          else
            BUILD_FLAG="-r"
          fi
          ./build_libe3 -c -d build -j $(nproc) $BUILD_FLAG -t

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, test]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare /opt/asn1c for caching
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo mkdir -p /opt/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/asn1c

      - name: Cache asn1c build
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: /opt/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install build dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          chmod +x ./build_libe3
          ./build_libe3 -I

      - name: Configure with integration tests
        if: needs.changes.outputs.code == 'true'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBE3_BUILD_INTEGRATION_TESTS=ON \
            -DLIBE3_ENABLE_LATREC=ON

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: cmake --build build -j $(nproc)

      - name: Run integration tests
        if: needs.changes.outputs.code == 'true'
        run: cd build && ctest -L integration --output-on-failure

  all-encodings:
    # Regression guard: ASN.1, JSON, and Protocol Buffers must all be buildable
    # together in a single libe3 (the encoder is selected at runtime via
    # E3Config.encoding). Builds one library with every encoder compiled in and
    # runs the full test suite against it.
    name: All Encodings (ASN.1 + JSON + Protobuf)
    runs-on: ubuntu-latest
    needs: [changes, test]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare /opt/asn1c for caching
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo mkdir -p /opt/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/asn1c

      - name: Cache asn1c build
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: /opt/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install build dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          chmod +x ./build_libe3
          ./build_libe3 -I

      - name: Configure with all encoders enabled
        if: needs.changes.outputs.code == 'true'
        run: |
          cmake -S . -B build-all \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBE3_ENABLE_ASN1=ON \
            -DLIBE3_ENABLE_JSON=ON \
            -DLIBE3_ENABLE_PROTOBUF=ON

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: cmake --build build-all -j $(nproc)

      - name: Run tests
        if: needs.changes.outputs.code == 'true'
        run: cd build-all && ctest --output-on-failure

      # Also the off-by-default transport combination, which nothing else
      # covered: connector_factory.cpp instantiated ZmqE3Connector
      # unconditionally while zmq_connector.cpp is only compiled when the option
      # is on, so LIBE3_ENABLE_ZMQ=OFF produced a library with an unresolvable
      # symbol. Lives in this job (rather than its own) so the required-status
      # ruleset does not have to change to gate on it.
      - name: Configure, build and test with ZeroMQ disabled
        if: needs.changes.outputs.code == 'true'
        run: |
          cmake -S . -B build-nozmq \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBE3_ENABLE_ZMQ=OFF
          cmake --build build-nozmq -j $(nproc)
          cd build-nozmq && ctest --output-on-failure

  swig:
    name: SWIG Python Bindings
    runs-on: ubuntu-latest
    needs: [changes, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Prepare /opt/asn1c for caching
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo mkdir -p /opt/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/asn1c

      - name: Cache asn1c build
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: /opt/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install build + SWIG dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get install -y swig python3-dev
          chmod +x ./build_libe3
          ./build_libe3 -I

      - name: Configure with SWIG enabled
        if: needs.changes.outputs.code == 'true'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            -DLIBE3_ENABLE_SWIG=ON \
            -DLIBE3_PYTHON_INSTALL_DIR="$PWD/stage/py"

      - name: Build SWIG bindings
        if: needs.changes.outputs.code == 'true'
        run: cmake --build build --target libe3py -j $(nproc)

      - name: Run SWIG smoke test
        if: needs.changes.outputs.code == 'true'
        run: PYTHONPATH=build/swig python3 tests/test_swig_smoke.py

      - name: Install and verify (module import + sm defs + smdir)
        if: needs.changes.outputs.code == 'true'
        run: |
          cmake --build build -j $(nproc)   # full lib needed for install
          cmake --install build
          PYTHONPATH="$PWD/stage/py" python3 -c "import libe3py; print('libe3py import OK')"
          smdir=$(PKG_CONFIG_PATH="$PWD/stage/lib/pkgconfig" pkg-config --variable=smdir libe3)
          echo "smdir=$smdir"
          test -f "$smdir/sm_simple/e3sm_simple.asn"
          test -f "$smdir/sm_simple/e3sm_simple.proto"

      # Everything else here builds in-tree, which is how a .pc with no feature
      # macros and an exported target pointing at an uninstalled tl::expected
      # both went unnoticed. This builds a standalone project against the
      # staged install, the way a real consumer does, on both routes.
      - name: Consume the installed package out of tree
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail

          # Route 1: the CMake package. Fails outright if the exported target
          # set references anything that was not installed.
          cmake -S tests/consume -B build-consume-cmake \
            -DCMAKE_PREFIX_PATH="$PWD/stage" \
            -DLIBE3_CONSUME_MODE=cmake
          cmake --build build-consume-cmake -j $(nproc)
          ./build-consume-cmake/consume

          # Route 2: pkg-config. main.cpp #errors if the encoding/ZMQ macros are
          # missing, so a .pc that under-specifies them fails the compile here
          # instead of silently changing the shape of the headers.
          cflags=$(PKG_CONFIG_PATH="$PWD/stage/lib/pkgconfig" pkg-config --cflags libe3)
          echo "pkg-config --cflags libe3: $cflags"
          # This job configures with the default encodings (ASN.1 on, JSON off)
          # and ZMQ on, so those exact macros must be advertised.
          grep -q -- '-DLIBE3_ENABLE_ASN1' <<<"$cflags"
          grep -q -- '-DLIBE3_HAS_ZMQ=1' <<<"$cflags"
          ! grep -q -- '-DLIBE3_ENABLE_JSON' <<<"$cflags"
          PKG_CONFIG_PATH="$PWD/stage/lib/pkgconfig" cmake -S tests/consume \
            -B build-consume-pkgconfig -DLIBE3_CONSUME_MODE=pkgconfig
          cmake --build build-consume-pkgconfig -j $(nproc)
          ./build-consume-pkgconfig/consume

  # NOTE: the MPMC Queue Benchmark moved to .github/workflows/mpmc-bench.yml,
  # where it is gated on changes to include/libe3/mpmc_queue.hpp so it only
  # runs when the queue's core file changes. It isn't in the required-checks
  # list, so it doesn't need this treatment.
