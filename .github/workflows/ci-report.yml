name: CI report

# One consolidated CI report comment per PR (issue #64). Every other workflow
# publishes its detail as a `ci-report-*` artifact and posts nothing itself;
# this job waits until they have all finished, then writes a single sticky
# comment with the verdict, a per-workflow table, that detail, and the
# fast-forward merge command once everything is green.
#
# This is the ONE required status check of the ruleset ("CI report"). The build
# and test workflows start only when a changed file is code, so none of them can
# be required on its own: a workflow kept off by its `paths` filter never reports.
# This job works out which workflows the PR's files should have started, waits
# for them, and fails when one failed or never started. It never waits on its own
# check, which is the one the ruleset reads.

on:
  pull_request:

concurrency:
  group: ci-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: CI report
    runs-on: ubuntu-latest
    # Generous: the required `Each commit builds and tests` context rebuilds
    # every commit in the series, so a long branch keeps this waiting.
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
      actions: read
      checks: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check the workflow filters this report relies on
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Wait for CI, then post the consolidated report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 .github/scripts/ci_report.py \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --sha "$HEAD_SHA" \
            --branch "$HEAD_REF" \
            --base-branch "$BASE_REF"
