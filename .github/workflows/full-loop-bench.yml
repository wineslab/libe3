name: Full-loop Latency Benchmark

# Runs the full-loop control-loop latency benchmark (tests/integration/
# bench_full_loop_latency.cpp) on every PR and publishes the per-phase
# markdown table for the consolidated CI report, mirroring the MPMC queue
# benchmark workflow.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: full-loop-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # A doc/CI-only PR previously never triggered this workflow at all (via
    # paths-ignore at the trigger level), so its required-check context
    # ("Full-loop latency") never reported anything -- at least as blocking
    # to a merge as an explicit failure. Trigger unconditionally instead and
    # gate the expensive steps below on this job's output, so the context
    # always reports a real `success` quickly on docs-only changes.
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          echo "Changed files:"; git diff --name-only "$base..$head"
          noncode='(\.md$)|(^docs/)|(^\.github/)|(^LICENSE$)|(^CONTRIBUTORS$)|(^\.gitignore$)'
          if git diff --name-only "$base..$head" | grep -qvE "$noncode"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  bench:
    name: Full-loop latency
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Prepare /opt/asn1c for caching
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo mkdir -p /opt/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/asn1c

      - name: Cache asn1c build
        # Exact-match only: a hit must imply the pinned commit inside
        # build_libe3 is unchanged. Do not add restore-keys here.
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: /opt/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          chmod +x ./build_libe3
          ./build_libe3 -I

      - name: Build Release with integration tests
        if: needs.changes.outputs.code == 'true'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBE3_BUILD_INTEGRATION_TESTS=ON \
            -DLIBE3_ENABLE_LATREC=ON
          cmake --build build --target test_bench_full_loop_latency -j $(nproc)

      - name: Run benchmark
        if: needs.changes.outputs.code == 'true'
        run: |
          # Filter out logger noise — bench prints its markdown to stdout.
          ./build/test_bench_full_loop_latency 2>/dev/null \
            | grep -v "^\[20" > bench_results.md
          cat bench_results.md

      - name: Assemble report fragment
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        run: |
          [ -f bench_results.md ] || exit 0
          {
            echo "### Full-loop latency"
            echo ""
            sed 's/(us)/(\&mu;s)/' bench_results.md
            echo ""
            echo "_ubuntu-latest, Release build, ZMQ + IPC, ASN.1 APER._"
            echo ""
            echo "_These numbers are measured inside a GitHub Actions container and should be treated as an upper bound on E3AP's and the library's own latency, not a representative deployment measurement._"
          } > ci-report-full-loop.md

      - name: Upload report fragment
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-report-full-loop
          path: ci-report-full-loop.md
          if-no-files-found: warn
