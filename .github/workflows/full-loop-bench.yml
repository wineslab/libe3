name: Full-loop Latency Benchmark

# Runs the full-loop control-loop latency benchmark (tests/integration/
# bench_full_loop_latency.cpp) on every PR and posts the per-phase
# markdown table as a PR comment, mirroring the MPMC queue benchmark
# workflow.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: full-loop-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # A doc/CI-only PR previously never triggered this workflow at all (via
    # paths-ignore at the trigger level), so its required-check context
    # ("Full-loop latency") never reported anything -- at least as blocking
    # to a merge as an explicit failure. Trigger unconditionally instead and
    # gate the expensive steps below on this job's output, so the context
    # always reports a real `success` quickly on docs-only changes.
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          echo "Changed files:"; git diff --name-only "$base..$head"
          noncode='(\.md$)|(^docs/)|(^\.github/)|(^LICENSE$)|(^CONTRIBUTORS$)|(^\.gitignore$)'
          if git diff --name-only "$base..$head" | grep -qvE "$noncode"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  bench:
    name: Full-loop latency
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Prepare /opt/asn1c for caching
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo mkdir -p /opt/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/asn1c

      - name: Cache asn1c build
        # Exact-match only: a hit must imply the pinned commit inside
        # build_libe3 is unchanged. Do not add restore-keys here.
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v5
        with:
          path: /opt/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          chmod +x ./build_libe3
          ./build_libe3 -I

      - name: Build Release with integration tests
        if: needs.changes.outputs.code == 'true'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBE3_BUILD_INTEGRATION_TESTS=ON
          cmake --build build --target test_bench_full_loop_latency -j $(nproc)

      - name: Run benchmark
        if: needs.changes.outputs.code == 'true'
        run: |
          # Filter out logger noise — bench prints its markdown to stdout.
          ./build/test_bench_full_loop_latency 2>/dev/null \
            | grep -v "^\[20" > bench_results.md
          cat bench_results.md

      - name: Post results as PR comment
        # bench_results.md only exists when the steps above actually ran --
        # reading it unconditionally would crash this step (and fail the job)
        # on a docs-only PR.
        if: ${{ needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('bench_results.md', 'utf8');
            const marker = '<!-- full-loop-latency-results -->';
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const body = [
              marker,
              `## ⏱️ Full-loop Latency Benchmark (commit \`${sha}\`)`,
              '',
              results,
              `> _Benchmarked on \`ubuntu-latest\`, Release build, ZMQ + IPC, ASN.1 APER._`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
