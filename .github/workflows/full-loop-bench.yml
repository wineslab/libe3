name: Full-loop Latency Benchmark

# Runs the full-loop control-loop latency benchmark (tests/integration/
# bench_full_loop_latency.cpp) on every PR and publishes the per-phase
# markdown table for the consolidated CI report, mirroring the MPMC queue
# benchmark workflow.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  bench:
    name: Full-loop latency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Prepare /opt/asn1c for caching
        run: |
          sudo mkdir -p /opt/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/asn1c

      - name: Cache asn1c build
        # Exact-match only: a hit must imply the pinned commit inside
        # build_libe3 is unchanged. Do not add restore-keys here.
        uses: actions/cache@v5
        with:
          path: /opt/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install dependencies
        run: |
          chmod +x ./build_libe3
          ./build_libe3 -I

      - name: Build Release with integration tests
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBE3_BUILD_INTEGRATION_TESTS=ON \
            -DLIBE3_ENABLE_LATREC=ON
          cmake --build build --target test_bench_full_loop_latency -j $(nproc)

      - name: Run benchmark
        run: |
          # Filter out logger noise — bench prints its markdown to stdout.
          ./build/test_bench_full_loop_latency 2>/dev/null \
            | grep -v "^\[20" > bench_results.md
          cat bench_results.md

      - name: Assemble report fragment
        if: ${{ always() }}
        run: |
          [ -f bench_results.md ] || exit 0
          {
            echo "### Full-loop latency"
            echo ""
            sed 's/(us)/(\&mu;s)/' bench_results.md
            echo ""
            echo "_ubuntu-latest, Release build, ZMQ + IPC, ASN.1 APER._"
            echo ""
            echo "_These numbers are measured inside a GitHub Actions container and should be treated as an upper bound on E3AP's and the library's own latency, not a representative deployment measurement._"
          } > ci-report-full-loop.md

      - name: Upload report fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-report-full-loop
          path: ci-report-full-loop.md
          if-no-files-found: warn
