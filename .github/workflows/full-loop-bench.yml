name: Full-loop Latency Benchmark

# Runs the full-loop control-loop latency benchmark (tests/integration/
# bench_full_loop_latency.cpp) on every PR and publishes the per-phase
# markdown table for the consolidated CI report, mirroring the MPMC queue
# benchmark workflow.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  bench:
    name: Full-loop latency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Prepare /opt/libe3/asn1c for caching
        run: |
          sudo mkdir -p /opt/libe3/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/libe3/asn1c

      - name: Cache asn1c build
        # Exact-match only: a hit must imply the pinned commit inside
        # build_libe3 is unchanged. Do not add restore-keys here.
        uses: actions/cache@v5
        with:
          path: /opt/libe3/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install dependencies
        run: |
          chmod +x ./build_libe3
          ./build_libe3 -I

      - name: Build Release with integration tests
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBE3_BUILD_INTEGRATION_TESTS=ON \
            -DLIBE3_ENABLE_LATREC=ON
          cmake --build build --target test_bench_full_loop_latency -j $(nproc)

      - name: Run benchmark
        run: |
          # One pass per control size: 0 PRBs (clear), 50 (the r2 mock block) and
          # 273 (every PRB of a 100 MHz carrier). The indication is 37 B, one L1-KPM
          # slot, in all three. Filter out logger noise: the bench prints its
          # markdown to stdout.
          : > bench_results.md
          for prbs in 0 50 273; do
            ./build/test_bench_full_loop_latency --ctrl-prbs "$prbs" 2>/dev/null \
              | grep -v "^\[20" >> bench_results.md
          done
          cat bench_results.md

      - name: Assemble report fragment
        if: ${{ always() }}
        run: |
          [ -f bench_results.md ] || exit 0
          {
            echo "### Full-loop latency"
            echo ""
            sed 's/(us)/(\&mu;s)/' bench_results.md
            echo ""
            echo "_ubuntu-latest, Release build, ZMQ + IPC, ASN.1 APER._"
            echo ""
            echo "_Payloads are real-sized: the indication carries 37 B of raw payload (one L1-KPM slot) and the control a Spectrum PRB block of 0, 100 (50 PRBs) or 546 B (273 PRBs), 2 B per PRB. The encoded sizes above include the Simple SM's own fields, so they run a few bytes over the real SMs'. Each table reports mean, p50, p99 and max._"
            echo ""
            echo "_Disclaimer: these runs are on general-purpose, unoptimized hardware (a shared GitHub-hosted ubuntu-latest runner in a container: no CPU pinning, no isolation, no tuned kernel or NIC), so they vary from run to run, p99 and max most of all. Treat them as an upper bound on E3AP's and the library's own latency, good for comparing one change with another, not as a representative deployment measurement._"
          } > ci-report-full-loop.md

      - name: Upload report fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-report-full-loop
          path: ci-report-full-loop.md
          if-no-files-found: warn
