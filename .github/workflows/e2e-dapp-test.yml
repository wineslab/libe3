name: E2E dApp Integration

# Runs example_simple_agent + example_simple_dapp as separate processes for
# every supported (link, transport) combination, asserts both exit cleanly,
# and publishes a per-combination summary for the consolidated CI report.
#
# The POSIX and the io_uring link run on IPC, TCP and SCTP (the hosted runner
# opens SCTP sockets; only the headers are installed here). ZeroMQ has no SCTP.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  asn1c-cache:
    # Builds/warms the asn1c cache once, ahead of the 8 matrix legs below, so
    # they don't race each other rebuilding it from source on a cold cache.
    name: Warm asn1c cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare /opt/asn1c for caching
        run: |
          sudo mkdir -p /opt/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/asn1c

      - name: Cache asn1c build
        # Exact-match only: a hit must imply the pinned commit inside
        # build_libe3 is unchanged. Do not add restore-keys here.
        uses: actions/cache@v5
        with:
          path: /opt/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install build dependencies
        run: |
          chmod +x ./build_libe3
          ./build_libe3 -I

  e2e:
    name: "E2E ${{ matrix.link }}/${{ matrix.transport }}"
    needs: asn1c-cache
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        link: [zmq, posix, uring]
        transport: [ipc, tcp, sctp]
        exclude:
          - link: zmq
            transport: sctp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare /opt/asn1c for caching
        run: |
          sudo mkdir -p /opt/asn1c
          sudo chown "$(id -u):$(id -g)" /opt/asn1c

      - name: Cache asn1c build
        uses: actions/cache@v5
        with:
          path: /opt/asn1c
          key: asn1c-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_libe3') }}

      - name: Install build dependencies
        run: |
          chmod +x ./build_libe3
          ./build_libe3 -I
          sudo apt-get install -y libsctp-dev

      - name: Build Release with examples
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIBE3_ENABLE_SCTP=ON
          cmake --build build -j $(nproc)
          grep -q '^LIBE3_WITH_URING:INTERNAL=ON' build/CMakeCache.txt || {
            echo "the io_uring link was not built (liburing missing?)"; exit 1; }

      # What a failing uring or sctp cell needs to be read: the kernel, and whether it lets this job use them.
      - name: Kernel, io_uring and SCTP on this runner
        run: |
          uname -r
          echo "kernel.io_uring_disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo absent)"
          python3 -c "import socket; socket.socket(socket.AF_INET, socket.SOCK_STREAM, 132).close(); print('SCTP sockets: yes')" \
            || echo "SCTP sockets: no"

      - name: Prepare IPC directory
        run: |
          sudo mkdir -p /tmp/dapps
          sudo chmod 777 /tmp/dapps

      - name: Run agent + dApp pair (${{ matrix.link }}/${{ matrix.transport }})
        id: e2e
        run: |
          set -e
          source ./scripts/wait_with_diagnostics.sh
          LOG_AGENT=/tmp/agent_${{ matrix.link }}_${{ matrix.transport }}.log
          LOG_DAPP=/tmp/dapp_${{ matrix.link }}_${{ matrix.transport }}.log

          ./build/example_simple_agent \
            --link ${{ matrix.link }} \
            --transport ${{ matrix.transport }} \
            --encoding asn1 > "$LOG_AGENT" 2>&1 &
          AGENT_PID=$!
          sleep 1

          set +e
          timeout -k 10 25s ./build/example_simple_dapp \
            --link ${{ matrix.link }} \
            --transport ${{ matrix.transport }} \
            --encoding asn1 --control --timed 15 > "$LOG_DAPP" 2>&1
          DAPP_EXIT=$?
          set -e

          # Stop the agent. wait_with_diagnostics bounds this at 30s and dumps
          # process state before SIGKILLing, instead of hanging indefinitely
          # if the agent ignores SIGINT (issue #60's E2E/Topologies deadlock).
          kill -INT $AGENT_PID 2>/dev/null || true
          wait_with_diagnostics "$AGENT_PID" 30 "example_simple_agent (${{ matrix.link }}/${{ matrix.transport }})" || true

          echo "---- AGENT LOG (tail) ----"
          tail -40 "$LOG_AGENT" || true
          echo "---- DAPP LOG (tail) ----"
          tail -40 "$LOG_DAPP" || true

          # Success criteria:
          # - dApp exits 0
          # - dApp log contains at least one decoded indication
          #
          # Resolved into a verdict first and acted on last, so the report
          # fragment below is written on the failing path too -- which is
          # exactly when its numbers are worth reading.
          IND_COUNT=$(grep -c "Indication #" "$LOG_DAPP" || true)
          REASON=""
          if [ "$DAPP_EXIT" -ne 0 ]; then
            REASON="dApp exit code $DAPP_EXIT (expected 0)"
          elif ! grep -q "Decoded indication\|Indication #" "$LOG_DAPP"; then
            REASON="no indications received by dApp"
          fi

          {
            if [ -z "$REASON" ]; then
              echo "### ✅ ${{ matrix.link }}/${{ matrix.transport }}"
            else
              echo "### ❌ ${{ matrix.link }}/${{ matrix.transport }} — $REASON"
            fi
            echo ""
            echo "- dApp exit: \`$DAPP_EXIT\`"
            echo "- Indications received: \`$IND_COUNT\`"
            echo ""
          } > /tmp/summary_${{ matrix.link }}_${{ matrix.transport }}.md

          if [ -n "$REASON" ]; then
            echo "$REASON"
            exit 1
          fi

      - name: Upload report fragment
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ci-report-e2e-dapp-${{ matrix.link }}-${{ matrix.transport }}
          path: /tmp/summary_${{ matrix.link }}_${{ matrix.transport }}.md
          if-no-files-found: warn
